[package]
name = "llm-manager"
version = "0.1.0"
edition = "2021"
description = "Local LLM manager: models, services, status"

[[bin]]
name = "llmmgr"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
